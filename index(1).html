<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baraash Creator Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e8e4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.shell{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px #00000008}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;letter-spacing:-.04em}.muted{color:var(--muted)}
.narrow{max-width:560px;margin:7vh auto}.hero h1{font-size:30px;letter-spacing:-.04em;margin:22px 0 7px}.hero p{margin:0;color:var(--muted)}
.field{margin-top:17px}.label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit;outline:0}textarea{min-height:85px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#999}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type,.btn{border:0;border-radius:12px;padding:13px;font-weight:750;cursor:pointer}.type{background:#fff;border:1px solid var(--line);text-align:left}.type.active{background:#111;color:#fff;border-color:#111}
.primary{background:#111;color:#fff;width:100%;margin-top:20px}.secondary{background:#f0f0ed}.message{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:13px}.message.ok{display:block;background:#ecfdf3;color:#18794e}.message.err{display:block;background:#fef3f2;color:#b42318}
.success{text-align:center;padding:42px 10px}.success .check{font-size:48px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat strong{display:block;font-size:28px;margin-top:6px}.stat span{font-size:11px;font-weight:750;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.nav .active{background:#111;color:#fff}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;color:var(--muted);letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.creator{border:1px solid var(--line);border-radius:15px;padding:15px}.creator h3{margin:0 0 5px}.creator p{margin:5px 0;font-size:12px;color:var(--muted)}.link{font-size:12px;word-break:break-all}.copy{margin-top:10px}.badge{font-size:11px;font-weight:750;background:#f0f0ed;border-radius:99px;padding:5px 8px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.shell{padding:14px}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL="https://zkiggtrwpjdcjooptfjf.supabase.co";
const SUPABASE_KEY="sb_publishable_C_AZCIkSe9GZwfwSHozwPg_X94L_H_7";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById("app");
const path=location.pathname.replace(/^\/+|\/+$/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
function shell(x){app.innerHTML='<div class="shell">'+x+"</div>"}
function msg(id,t,c){const e=document.getElementById(id);e.textContent=t;e.className="message "+c}

async function creatorPage(){
 if(!path)return notFound();
 const {data:c}=await sb.rpc("get_creator_by_slug",{p_slug:path});
 if(!c)return notFound();
 shell(`<div class="card narrow"><div class="top"><div class="brand">BARAASH</div><small class="muted">Creator Hub</small></div>
 <div class="hero"><h1>Submit your content</h1><p>Hi ${esc(c.name)} 👋 Submit your TikTok video or LIVE in a few seconds.</p></div>
 <form id="form"><div class="field"><span class="label">Content type</span><div class="types">
 <button type="button" class="type active" data-t="video">🎥 Video</button><button type="button" class="type" data-t="live">🔴 LIVE</button></div></div>
 <div class="field"><label class="label">Product</label><select id="product" required><option value="">Loading...</option></select></div>
 <div class="row"><div class="field"><label class="label">Post date</label><input id="date" type="date" value="${today()}" required></div>
 <div class="field"><label class="label">TikTok URL</label><input id="url" type="url" placeholder="https://www.tiktok.com/..." required></div></div>
 <div class="field"><label class="label">Notes <span class="muted">(optional)</span></label><textarea id="notes" placeholder="Anything we should know?"></textarea></div>
 <div id="msg" class="message"></div><button id="submit" class="btn primary">Submit content</button></form></div>`);
 let type="video";
 document.querySelectorAll(".type").forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll(".type").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
 const {data:ps}=await sb.from("products").select("name").eq("status","active").order("name");
 product.innerHTML='<option value="">Select product</option>'+(ps||[]).map(p=>`<option>${esc(p.name)}</option>`).join("");
 form.onsubmit=async e=>{
  e.preventDefault();submit.disabled=true;submit.textContent="Submitting...";
  const {error}=await sb.rpc("submit_creator_content",{p_access_token:c.access_token,p_product_name:product.value,p_content_type:type,p_post_date:date.value,p_tiktok_url:url.value,p_notes:notes.value});
  if(error){msg("msg",error.message,"err");submit.disabled=false;submit.textContent="Submit content";return}
  app.innerHTML='<div class="shell"><div class="card narrow success"><div class="check">✓</div><h2>Submitted!</h2><p class="muted">Your content has been recorded. You can close this page.</p></div></div>';
 };
}
function notFound(){shell('<div class="card narrow success"><div class="check">🔗</div><h2>Link not found</h2><p class="muted">This creator link is invalid or inactive.</p></div>')}

async function admin(){
 const {data:{session}}=await sb.auth.getSession(); if(!session)return login();
 shell(`<div><div class="top"><div><div class="brand">BARAASH CREATOR HUB</div><h1>Dashboard</h1><small class="muted">${esc(session.user.email)}</small></div><button id="logout" class="btn secondary">Log out</button></div>
 <div class="stats"><div class="card stat"><span>ACTIVE CREATORS</span><strong id="a">—</strong></div><div class="card stat"><span>VIDEOS THIS WEEK</span><strong id="v">—</strong></div><div class="card stat"><span>LIVES THIS WEEK</span><strong id="l">—</strong></div><div class="card stat"><span>SUBMISSIONS</span><strong id="s">—</strong></div></div>
 <div class="nav"><button class="active" data-v="overview">Overview</button><button data-v="creators">Creators</button><button data-v="submissions">Submissions</button><button data-v="links">Creator Links</button></div><div id="panel"></div></div>`);
 logout.onclick=async()=>{await sb.auth.signOut();location.reload()};
 const [cr,su]=await Promise.all([sb.from("creators").select("*").order("created_at",{ascending:false}),sb.from("content_submissions").select("*,creators(name),products(name)").order("submitted_at",{ascending:false}).limit(300)]);
 if(cr.error||su.error){panel.innerHTML='<div class="card"><b>Could not load dashboard.</b><p class="muted">Run the admin_rls.sql file included with this project.</p></div>';return}
 window.C=cr.data||[];window.S=su.data||[];
 const d=new Date(),dow=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-dow);m.setHours(0,0,0,0);
 const w=S.filter(x=>new Date(x.post_date+"T00:00:00")>=m);
 a.textContent=C.filter(x=>x.status==="active").length;v.textContent=w.filter(x=>x.content_type==="video").length;l.textContent=w.filter(x=>x.content_type==="live").length;s.textContent=S.length;
 document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");view(b.dataset.v)});
 view("overview");
}
function login(){shell(`<div class="card narrow"><div class="brand">BARAASH</div><h1>Creator Hub</h1><p class="muted">Admin login</p><form id="lf"><div class="field"><label class="label">Email</label><input id="em" type="email" required></div><div class="field"><label class="label">Password</label><input id="pw" type="password" required></div><div id="lm" class="message"></div><button class="btn primary">Log in</button></form></div>`);
lf.onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});if(error)msg("lm",error.message,"err");else admin()}}
function table(rows){if(!rows.length)return '<p class="muted">No submissions yet.</p>';return `<table class="table"><thead><tr><th>Creator</th><th>Type</th><th>Product</th><th>Post date</th><th>TikTok</th></tr></thead><tbody>`+rows.map(x=>`<tr><td><b>${esc(x.creators?.name)}</b></td><td><span class="badge">${esc(x.content_type)}</span></td><td>${esc(x.products?.name||"—")}</td><td>${esc(x.post_date)}</td><td><a href="${esc(x.tiktok_url)}" target="_blank">Open ↗</a></td></tr>`).join("")+"</tbody></table>"}
function view(v){
 if(v==="overview")panel.innerHTML='<div class="card"><h2>Latest submissions</h2><div class="tablewrap">'+table(S.slice(0,15))+"</div></div>";
 if(v==="submissions")panel.innerHTML='<div class="card"><h2>All submissions</h2><div class="tablewrap">'+table(S)+"</div></div>";
 if(v==="creators")panel.innerHTML='<div class="card"><h2>Creators</h2><div class="grid">'+C.map(c=>`<div class="creator"><h3>${esc(c.name)}</h3><p>${esc(c.tiktok_username||"")}</p><p>${c.videos_per_week} videos/week · ${c.lives_per_week} lives/week</p><p>Status: <b>${esc(c.status)}</b></p></div>`).join("")+"</div></div>";
 if(v==="links")panel.innerHTML='<div class="card"><h2>Creator links</h2><p class="muted">Each creator gets a personal link.</p><div class="grid">'+C.map(c=>{let u=location.origin+"/"+encodeURIComponent(c.slug);return `<div class="creator"><h3>${esc(c.name)}</h3><div class="link">${esc(u)}</div><button class="btn secondary copy" data-url="${esc(u)}">Copy link</button></div>`}).join("")+"</div></div>";
 document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.url);b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy link",1200)})
}
if(path==="admin")admin();else creatorPage();
</script>
</body></html>
